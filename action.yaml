name: AUR Update
description: Check upstream for a new release or commit and bump a PKGBUILD accordingly
author: Sergey Kanafyev

branding:
  icon: refresh-cw
  color: blue

inputs:
  path:
    description: Directory containing the PKGBUILD to update
    required: false
    default: '.'
  github-token:
    description: GitHub token for API and git operations
    required: false
    default: ${{ github.token }}
  commit-message:
    description: Commit message (optional)
    required: false
    default: ''
  target-tag:
    description: >-
      Explicit upstream tag to update to, bypassing the latest-release/tag
      lookup. Useful when the caller has its own logic for picking the
      target (e.g. filtering releases by a criterion not expressible as
      "latest").
    required: false
    default: ''
  git-user-name:
    description: Git author name used for the update commit
    required: false
    default: github-actions[bot]
  git-user-email:
    description: Git author email used for the update commit
    required: false
    default: github-actions[bot]@users.noreply.github.com

outputs:
  updated:
    description: "'true' if a new version was found and committed, 'false' otherwise"

runs:
  using: docker
  image: Dockerfile
  env:
    PKG_PATH: ${{ inputs.path }}
    GITHUB_TOKEN: ${{ inputs.github-token }}
    COMMIT_MSG: ${{ inputs.commit-message }}
    TARGET_TAG: ${{ inputs.target-tag }}
    GIT_USER_NAME: ${{ inputs.git-user-name }}
    GIT_USER_EMAIL: ${{ inputs.git-user-email }}
